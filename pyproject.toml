[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apexrunner-tools"
version = "0.2.0"
description = "LangChain and CrewAI tools for APEX Runner pre-trade crypto signals (risk, execution timing, slippage, trade safety) and RiskShield, a fail-closed pre-trade gate, paid per call over x402 in USDC on Base."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "APEX Runner", email = "267811382+kynto2001-ctrl@users.noreply.github.com" }]
keywords = ["x402", "langchain", "crewai", "crypto", "trading", "agents", "usdc", "base", "risk-management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Developers",
]
dependencies = [
  # 2.8 is the floor the API was verified against (same names through 2.28).
  "x402[evm,requests,httpx]>=2.8,<3",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.0,<2"]
crewai = ["crewai>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "langchain-core>=1.0,<2", "crewai>=1.0,<2"]

[project.urls]
Homepage = "https://apexrunner.ai"
Documentation = "https://apexrunner.ai/signals/docs/"
Repository = "https://github.com/kynto2001-ctrl/apexrunner-tools"
Issues = "https://github.com/kynto2001-ctrl/apexrunner-tools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/apexrunner_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
# scripts/ holds APEX-internal ops tooling (live paid test, seed wallet address, key path).
exclude = ["scripts/", ".github/", ".venv/", "dist/"]
